name: Production Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm install --ignore-scripts --force --no-audit --no-fund 2>&1 | tee install.log
          echo ${PIPESTATUS[0]} > install.exit
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          echo ${PIPESTATUS[0]} > build.exit
      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "install_exit=$(cat install.exit 2>/dev/null || echo missing)"
            echo "build_exit=$(cat build.exit 2>/dev/null || echo missing)"
            echo "--- install log ---"
            cat install.log 2>/dev/null || true
            echo "--- build log ---"
            cat build.log 2>/dev/null || true
          } > diagnostic.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-diagnostics
          path: |
            diagnostic.txt
            install.log
            build.log
